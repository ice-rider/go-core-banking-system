# docker-compose.prod.yml - для продакшена
# Использование: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  nginx:
    image: nginx:1.31-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api-gateway
    restart: unless-stopped
    networks:
      - bank-network

  api-gateway:
    build:
      context: .
      dockerfile: server/cmd/api-gateway/Dockerfile
    environment:
      - ACCOUNT_SERVICE_ADDR=account-service:9001
      - TRANSACTION_SERVICE_ADDR=transaction-service:9002
      - JAEGER_ENDPOINT=http://jaeger:14268/api/traces
    depends_on:
      - account-service
      - transaction-service
    restart: unless-stopped
    networks:
      - bank-network

  account-service:
    build:
      context: .
      dockerfile: server/cmd/account-service/Dockerfile
    environment:
      - DB_HOST=postgres-account
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=account_db
      - GRPC_PORT=9001
      - JAEGER_ENDPOINT=http://jaeger:14268/api/traces
    depends_on:
      postgres-account:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bank-network

  transaction-service:
    build:
      context: .
      dockerfile: server/cmd/transaction-service/Dockerfile
    environment:
      - DB_HOST=postgres-transaction
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=transaction_db
      - GRPC_PORT=9002
      - ACCOUNT_SERVICE_ADDR=account-service:9001
      - RABBITMQ_ADDR=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JAEGER_ENDPOINT=http://jaeger:14268/api/traces
    depends_on:
      postgres-transaction:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bank-network

  postgres-account:
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: account_db
    volumes:
      - pgaccount_data:/var/lib/postgresql/data
    restart: unless-stopped

  postgres-transaction:
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: transaction_db
    volumes:
      - pgtransaction_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    restart: unless-stopped

  rabbitmq:
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

  jaeger:
    restart: unless-stopped

  prometheus:
    restart: unless-stopped

  grafana:
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
    restart: unless-stopped

volumes:
  pgaccount_data:
  pgtransaction_data:
  redis_data:
  rabbitmq_data:
