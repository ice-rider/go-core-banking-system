services:
  postgres-account:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: bank_secret
      POSTGRES_DB: account_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank -d account_db"]
      interval: 2s
      timeout: 3s
      retries: 10
    networks:
      - bank-network

  postgres-transaction:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: bank_secret
      POSTGRES_DB: transaction_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank -d transaction_db"]
      interval: 2s
      timeout: 3s
      retries: 10
    networks:
      - bank-network

  redis:
    image: redis:8-alpine
    networks:
      - bank-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: bank
      RABBITMQ_DEFAULT_PASS: bank_secret
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - bank-network

  jaeger:
    image: jaegertracing/all-in-one:1.65
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - bank-network

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - bank-network

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./configs/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - bank-network

volumes:
  grafana_data:

networks:
  bank-network:
    driver: bridge
