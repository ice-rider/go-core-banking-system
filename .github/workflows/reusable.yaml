name: Reusable CI

on:
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string
      push_latest:
        required: false
        type: boolean
        default: false
      push_dev:
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write
  checks: write
  packages: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: server
          only-new-issues: true

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        working-directory: server
        run: govulncheck ./...

  test:
    runs-on: ubuntu-latest
    needs: [lint, security]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Install dependencies
        working-directory: server
        run: go mod download

      - name: Check formatting
        working-directory: server
        run: |
          gofmt -l -s .
          if [ -n "$(gofmt -l -s .)" ]; then
            echo "❌ Files are not formatted. Run 'gofmt -w .' to fix."
            exit 1
          fi

      - name: Run tests with coverage
        working-directory: server
        run: |
          go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...
          go tool cover -func=coverage.txt

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: server/coverage.txt

  check_conflicts:
    runs-on: ubuntu-latest
    outputs:
      has_conflicts: ${{ steps.check.outputs.has_conflicts }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for merge conflicts
        id: check
        run: |
          git fetch origin develop
          if git merge origin/develop --no-commit --no-ff 2>&1; then
            echo "has_conflicts=false" >> $GITHUB_OUTPUT
            echo "✅ No merge conflicts"
          else
            echo "has_conflicts=true" >> $GITHUB_OUTPUT
            echo "❌ Merge conflicts detected!"
            git merge --abort
            exit 1
          fi

  docker_build:
    runs-on: ubuntu-latest
    needs: [lint, security]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:ci-check
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker_push:
    runs-on: ubuntu-latest
    needs: [test, docker_build, check_conflicts]
    if: needs.check_conflicts.outputs.has_conflicts == 'false'
    steps:
      - uses: actions/checkout@v4

      - name: Sanitize image tag
        id: tag
        run: |
          RAW="${{ inputs.image_tag }}"
          echo "image_tag=${RAW//\//-}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ steps.tag.outputs.image_tag }}
            ${{ inputs.push_latest && format('ghcr.io/{0}/{1}:latest', github.repository_owner, github.event.repository.name) || '' }}
            ${{ inputs.push_dev && format('ghcr.io/{0}/{1}:dev', github.repository_owner, github.event.repository.name) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  comment_result:
    runs-on: ubuntu-latest
    needs: [lint, security, test, check_conflicts, docker_build, docker_push]
    if: always()
    steps:
      - name: Comment PR with status
        uses: actions/github-script@v7
        with:
          script: |
            const lintStatus = '${{ needs.lint.result }}';
            const securityStatus = '${{ needs.security.result }}';
            const testStatus = '${{ needs.test.result }}';
            const conflictStatus = '${{ needs.check_conflicts.result }}';
            const dockerBuildStatus = '${{ needs.docker_build.result }}';
            const dockerPushStatus = '${{ needs.docker_push.result }}';

            let message = '## CI Pipeline Results\n\n';
            message += `### ✅ Linting: ${lintStatus === 'success' ? '✅ Passed' : '❌ Failed'}\n`;
            message += `### 🔒 Security: ${securityStatus === 'success' ? '✅ Passed' : '❌ Failed'}\n`;
            message += `### 🧪 Tests: ${testStatus === 'success' ? '✅ Passed' : '❌ Failed'}\n`;
            message += `### 🔀 Merge Conflicts: ${conflictStatus === 'success' ? '✅ None' : '❌ Conflicts detected'}\n`;

            if (testStatus === 'success') {
              message += `- Coverage report uploaded to Codecov\n`;
            }

            if (dockerPushStatus === 'success') {
              message += `### 🐳 Docker: ✅ Built and pushed\n`;
              message += `- Image SHA: \`${{ github.sha }}\`\n`;
            } else if (dockerBuildStatus === 'failure') {
              message += `### 🐳 Docker: ❌ Build failed\n`;
            } else if (dockerPushStatus === 'skipped') {
              message += `### 🐳 Docker: ⏭️ Push skipped (tests or conflicts failed)\n`;
            } else {
              message += `### 🐳 Docker: ❌ Push failed\n`;
            }

            const allPassed = lintStatus === 'success' && securityStatus === 'success' &&
                              testStatus === 'success' && conflictStatus === 'success' &&
                              dockerPushStatus === 'success';

            if (allPassed) {
              message += `\n## ✅ All checks passed!`;
            } else {
              message += `\n## ❌ Some checks failed!\n`;
              const failed = [];
              if (lintStatus !== 'success') failed.push('Linting');
              if (securityStatus !== 'success') failed.push('Security');
              if (testStatus !== 'success') failed.push('Tests');
              if (conflictStatus !== 'success') failed.push('Merge Conflicts');
              if (dockerBuildStatus === 'failure') failed.push('Docker Build');
              if (dockerPushStatus === 'failure') failed.push('Docker Push');
              message += `\nFailed: **${failed.join(', ')}**\n`;
              message += `\nCheck workflow logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            }

            let issueNumber = context.issue.number;

            if (!issueNumber) {
              const headRef = context.ref.replace('refs/heads/', '');
              const { data: prs } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head: `${context.repo.owner}:${headRef}`,
                state: 'open'
              });
              if (prs.length > 0) {
                issueNumber = prs[0].number;
              }
            }

            if (!issueNumber) {
              core.info('No PR found, skipping comment');
              core.summary.addRaw(message);
              return;
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('## CI Pipeline Results')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: message,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: message,
              });
            }
