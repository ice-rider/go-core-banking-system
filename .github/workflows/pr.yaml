name: CI Pull Request

on:
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
      - 'hotfix/**'
  pull_request:
    branches: [develop]

jobs:
  ci:
    permissions:
      contents: read
      pull-requests: write
      checks: write
      packages: write
    uses: ./.github/workflows/reusable.yaml
    with:
      image_tag: ${{ github.event.pull_request.head.ref || github.ref_name }}
      push_latest: false
      push_dev: false
    secrets: inherit

  auto_approve:
    runs-on: ubuntu-latest
    needs: ci
    if: |
      always() &&
      needs.ci.result == 'success' &&
      github.actor != 'dependabot[bot]'
    steps:
      - name: Find PR number
        id: find_pr
        uses: jwalton/gh-find-current-pr@v1
        with:
          state: open

      - name: Auto-approve PR
        if: steps.find_pr.outputs.pr
        uses: hmarr/auto-approve-action@v4
        with:
          pr-number: ${{ steps.find_pr.outputs.pr }}
          review-message: "✅ All CI checks passed! Auto-approved."

      - name: Add ready-to-merge label
        if: steps.find_pr.outputs.pr
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.find_pr.outputs.pr }},
              labels: ['ready-to-merge', 'ci-passed']
            });
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: ${{ steps.find_pr.outputs.pr }},
                name: 'WIP'
              });
            } catch (e) {}