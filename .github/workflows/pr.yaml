name: CI Pull Request

on:
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
      - 'hotfix/**'
  pull_request:
    branches: [develop]

permissions:
  contents: read
  pull-requests: write
  checks: write
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/reusable.yaml
    with:
      image_tag: ${{ github.event.pull_request.head.ref || github.ref_name }}
      push_latest: false
      push_dev: false
    secrets: inherit
