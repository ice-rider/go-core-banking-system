name: CI Pull Request

on:
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
      - 'hotfix/**'
  pull_request:
    branches: [develop]

permissions:
  contents: read
  pull-requests: write
  checks: write
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/reusable.yaml
    with:
      image_tag: ${{ github.event.pull_request.head.ref || github.ref_name }}
      push_latest: false
      push_dev: false
    secrets: inherit

  auto_approve:
    runs-on: ubuntu-latest
    needs: ci
    if: |
      always() &&
      needs.ci.result == 'success' &&
      github.actor != 'dependabot[bot]'
    steps:
      - name: Find PR number
        id: find_pr
        uses: jwalton/gh-find-current-pr@v1
        with:
          state: open

      - name: Auto-approve PR
        if: steps.find_pr.outputs.pr
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.APPROVER_BOT_TOKEN }}
          script: |
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: parseInt('${{ steps.find_pr.outputs.pr }}'),
              event: 'APPROVE',
              body: '✅ All CI checks passed! Auto-approved.'
            });

      - name: Add ready-to-merge label
        if: steps.find_pr.outputs.pr
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt('${{ steps.find_pr.outputs.pr }}'),
              labels: ['ready-to-merge', 'ci-passed']
            });
